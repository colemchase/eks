# Current deployed pattern: ESO assumes the shared Build reader role to obtain
# an ECR token. Apply this after External Secrets Operator is running.
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: ECRAuthorizationToken
metadata:
  name: build-helm-chart-ecr-token
  namespace: argocd
spec:
  region: REPLACE_WITH_REGION
  role: REPLACE_WITH_BUILD_HELM_READER_ROLE_ARN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: build-helm-chart-repository
  namespace: argocd
spec:
  refreshInterval: 6h
  target:
    name: build-helm-chart-repository
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
        annotations:
          ecr.expiresAt: "{{ .expires_at }}"
      data:
        type: helm
        name: build-helm-charts
        url: REPLACE_WITH_BUILD_ACCOUNT_ID.dkr.ecr.REPLACE_WITH_REGION.amazonaws.com
        enableOCI: "true"
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ECRAuthorizationToken
          name: build-helm-chart-ecr-token
